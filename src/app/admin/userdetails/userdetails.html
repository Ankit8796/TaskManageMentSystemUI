<div class="setting-body">
    <div class="container-fluid">
        <!-- Header Row: Title + Buttons -->
        <div class="row align-items-center">
            <div class="col-md-6 mb-2 mb-md-0">
                <h3 class="mb-0 fw-bold d-flex align-items-center">
                    <i class="fa-solid fa-users me-2 text-success"></i>
                   All Users
                    <span class="badge bg-success rounded-pill ms-3 fs-6">
                        <!-- {{ totalCount || 0 }} -->
                    </span>
                </h3>
            </div>
            <div class="col-md-6 text-md-end">
                <!-- <button class="btn btn-success btn-sm" >Find a Place</button> -->
            </div>
        </div>
        <!-- Searching and filtering dropdown -->


        <!--  If applications exist -->
        <div class="row mt-3" *ngIf="alluserDetails.length > 0;">
            <div class="col-md-4 col-sm-6  xs-12 col-lg-4 col-xl-3 mb-4 " *ngFor="let application of alluserDetails">
                <div
                    class="card p-3 position-relative shadow-sm h-100 border-success rounded-4 d-flex flex-column appliaction-ListBody">
                    <div class="d-flex flex-column align-items-center text-center mb-2">
                        <div class="rounded-circle bg-success text-white d-flex justify-content-center align-items-center"
                            style="width: 60px; height: 60px; font-size: 24px; overflow: hidden;">
                            <span class="upper">
                                {{
                                (application.firstName.charAt(0).toUpperCase() || '') +
                                (application.lastName.charAt(0).toUpperCase() || '')
                                }}
                            </span>
                        </div>
                        <div class="fw-semibold mt-2">
                           {{application.email}}
                        </div>
                    </div>


                    <div class="text-center border-top pt-3 mt-3 border-success mt-auto">
                        <a role="button" class="text-success fw-bold text-decoration-none" (click)="taskDetails(application.userId)">View
                            Details</a>
                    </div>
                </div>
            </div>

        </div>
